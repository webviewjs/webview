[package]
authors = ["Twilight <hello@twlite.dev>"]
edition = "2021"
name = "webview"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.8.2", default-features = true, features = ["napi9"] }
napi-derive = "3.5.1"
serde_json = "1"

tao = { version = "0.37.1", features = ["rwh_06"] }
wry = { version = "0.55.1", features = ["devtools", "fullscreen", "protocol"] }
dpi = "0.1"
image = "0.25.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.15.4"
muda = { version = "0.19.3", features = ["libxdo"] }
tray-icon = "0.24.1"
notify-rust = { version = "4.18.0", features = ["images_no_default_features"] }
tempfile = "3"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "ios"))))'.dependencies]
futures-lite = "2.6.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
tao = { git = "https://github.com/webviewjs/tao", rev = "895c1cf9678c365d333520c254559b0e50eca1cc" }

[build-dependencies]
napi-build = "2"
serde_json = "1"

[profile.release]
lto = true
