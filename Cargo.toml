[package]
authors = ["Twilight <hello@twlite.dev>"]
edition = "2021"
name = "webview"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.8.2", default-features = true, features = ["napi9"] }
napi-derive = "3.5.1"
serde_json = "1"

# Full GUI stack — not available / not needed on the FreeBSD stub build.
[target.'cfg(not(target_os = "freebsd"))'.dependencies]
tao = { version = "0.37.2", features = ["rwh_06"] }
wry = { version = "0.55.1", features = [
  "devtools",
  "fullscreen",
  "linux-body",
  "protocol",
  "transparent",
] }
dpi = "0.1"
image = "0.25.10"

[target.'cfg(not(any(target_os = "android", target_os = "freebsd")))'.dependencies]
rfd = "0.15.4"
muda = { version = "0.19.3", features = ["libxdo"] }
tray-icon = "0.24.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "freebsd")))'.dependencies]
notify-rust = { version = "4.18.0", features = ["images_no_default_features"] }
tempfile = "3"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "ios", target_os = "freebsd"))))'.dependencies]
futures-lite = "2.6.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSApplication",
  "NSResponder",
  "NSImage",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSData",
] }

[patch.crates-io]
tao = { git = "https://github.com/webviewjs/tao", rev = "9bb2bdc097e430f924a69add056ae55335492ab7" }

[build-dependencies]
napi-build = "2"
serde_json = "1"

[profile.release]
lto = true
