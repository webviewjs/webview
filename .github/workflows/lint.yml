name: Lint and docs

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev pkg-config

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Oxlint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Clippy
        run: cargo clippy --manifest-path packages/webview/Cargo.toml -- -D warnings

      - name: Cargo check
        run: cargo check --manifest-path packages/webview/Cargo.toml

      - name: Build native addon for tests
        run: bun run build:native --target x86_64-unknown-linux-gnu
        working-directory: packages/webview

      - name: Run tests
        run: bun run test

  docs:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static docs
        run: bun run build --filter=@webviewjs/docs
