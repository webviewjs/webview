name: CI

env:
  DEBUG: napi:*
  APP_NAME: webview
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - main
    paths:
      - packages/webview/**
      - bun.lock
      - package.json
      - turbo.json
      - .cargo/**
      - rustfmt.toml
      - .github/workflows/CI.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-version:
    name: Read release version
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from commit message
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          COMMIT_MSG="$(git log -1 --pretty=%B)"
          stable_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          prerelease_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[A-Za-z0-9-]+\.(0|[1-9][0-9]*)$'

          if [[ "$COMMIT_MSG" =~ $stable_regex ]]; then
            VERSION="$COMMIT_MSG"
            TAG=latest
            IS_RELEASE=true
          elif [[ "$COMMIT_MSG" =~ $prerelease_regex ]]; then
            VERSION="$COMMIT_MSG"
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
            if [[ "$TAG" =~ ^[0-9]+$ || "$TAG" =~ ^[vV][0-9]+$ || "$TAG" == x || "$TAG" == X ]]; then
              TAG=next
            fi
            IS_RELEASE=true
          else
            VERSION=
            TAG=latest
            IS_RELEASE=false
          fi

          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == pull_request || "$IS_RELEASE" == true ]]; then
            SHOULD_BUILD=true
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            SHOULD_BUILD=true
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
            packages/webview \
            bun.lock \
            package.json \
            turbo.json \
            .cargo \
            rustfmt.toml \
            .github/workflows/CI.yml; then
            SHOULD_BUILD=false
          else
            SHOULD_BUILD=true
          fi

          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.settings.os }} - ${{ matrix.settings.target }}
    needs: release-version
    if: needs.release-version.outputs.should_build == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            build_script: |
              export PKG_CONFIG_ALLOW_CROSS=1
              bun run build --target aarch64-apple-darwin

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sys_deps: pkg-config libwebkit2gtk-4.1-dev libsoup-3.0-dev libglib2.0-dev libcairo2-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev libgtk-3-dev libxdo-dev

          # Linux ia32
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            # Debian Trixie split the GLib/GObject build tools from the target
            # libraries and made them cross-compilation aware. Bookworm's
            # multiarch resolver incorrectly selects gobject-introspection:i386
            # and then fails on its unavailable i386 Python toolchain.
            container: node:24-trixie
            cross_arch: i386
            cross_sys_deps: libglib2.0-dev:i386 libwebkit2gtk-4.1-dev:i386 libsoup-3.0-dev:i386 libcairo2-dev:i386 libpango1.0-dev:i386 libatk1.0-dev:i386 libgdk-pixbuf-2.0-dev:i386 libgtk-3-dev:i386 libxdo-dev:i386
            cross_gcc: gcc-i686-linux-gnu
            cross_gpp: g++-i686-linux-gnu
            cross_triplet: i686-linux-gnu
            build_script: |
              set -e
              rustup target add i686-unknown-linux-gnu
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
              export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1
              export PKG_CONFIG_SYSROOT_DIR=/
              export PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_i686_unknown_linux_gnu=pkg-config
              export PKG_CONFIG_SYSROOT_DIR_i686_unknown_linux_gnu=/
              export PKG_CONFIG_LIBDIR_i686_unknown_linux_gnu=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_PATH_i686_unknown_linux_gnu=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export CC=i686-linux-gnu-gcc
              export CXX=i686-linux-gnu-g++
              export AR=i686-linux-gnu-ar
              export RANLIB=i686-linux-gnu-ranlib
              export CC_i686_unknown_linux_gnu=i686-linux-gnu-gcc
              export CXX_i686_unknown_linux_gnu=i686-linux-gnu-g++
              export AR_i686_unknown_linux_gnu=i686-linux-gnu-ar
              export RANLIB_i686_unknown_linux_gnu=i686-linux-gnu-ranlib
              export CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=i686-linux-gnu-gcc
              bun run build --target i686-unknown-linux-gnu

          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            container: node:24-trixie
            cross_arch: arm64
            cross_sys_deps: libglib2.0-dev:arm64 libwebkit2gtk-4.1-dev:arm64 libsoup-3.0-dev:arm64 libcairo2-dev:arm64 libpango1.0-dev:arm64 libatk1.0-dev:arm64 libgdk-pixbuf-2.0-dev:arm64 libgtk-3-dev:arm64 libxdo-dev:arm64
            cross_gcc: gcc-aarch64-linux-gnu
            cross_gpp: g++-aarch64-linux-gnu
            cross_triplet: aarch64-linux-gnu
            build_script: |
              set -e
              rustup target add aarch64-unknown-linux-gnu
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
              export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1
              export PKG_CONFIG_SYSROOT_DIR=/
              export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_aarch64_unknown_linux_gnu=pkg-config
              export PKG_CONFIG_SYSROOT_DIR_aarch64_unknown_linux_gnu=/
              export PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export CC=aarch64-linux-gnu-gcc
              export CXX=aarch64-linux-gnu-g++
              export AR=aarch64-linux-gnu-ar
              export RANLIB=aarch64-linux-gnu-ranlib
              export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
              export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
              export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
              export RANLIB_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ranlib
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              bun run build --target aarch64-unknown-linux-gnu

          # Linux ARMv7
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            container: node:24-trixie
            cross_arch: armhf
            cross_sys_deps: libglib2.0-dev:armhf libwebkit2gtk-4.1-dev:armhf libsoup-3.0-dev:armhf libcairo2-dev:armhf libpango1.0-dev:armhf libatk1.0-dev:armhf libgdk-pixbuf-2.0-dev:armhf libgtk-3-dev:armhf libxdo-dev:armhf
            cross_gcc: gcc-arm-linux-gnueabihf
            cross_gpp: g++-arm-linux-gnueabihf
            cross_triplet: arm-linux-gnueabihf
            build_script: |
              set -e
              rustup target add armv7-unknown-linux-gnueabihf
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
              export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1
              export PKG_CONFIG_SYSROOT_DIR=/
              export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_armv7_unknown_linux_gnueabihf=pkg-config
              export PKG_CONFIG_SYSROOT_DIR_armv7_unknown_linux_gnueabihf=/
              export PKG_CONFIG_LIBDIR_armv7_unknown_linux_gnueabihf=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_PATH_armv7_unknown_linux_gnueabihf=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
              export CC=arm-linux-gnueabihf-gcc
              export CXX=arm-linux-gnueabihf-g++
              export AR=arm-linux-gnueabihf-ar
              export RANLIB=arm-linux-gnueabihf-ranlib
              export CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc
              export CXX_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-g++
              export AR_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar
              export RANLIB_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-ranlib
              export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
              bun run build --target armv7-unknown-linux-gnueabihf

          # Android
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: ubuntu-latest
            target: armv7-linux-androideabi

    runs-on: ${{ matrix.settings.os }}
    container: ${{ matrix.settings.container || null }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target || matrix.settings.rust_target }}

      - name: Setup Zig for cross-compilation
        if: matrix.settings.use_zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ runner.os == 'Windows' && 'hoisted-' || '' }}${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The Windows runner can retain an isolated .bun dependency tree whose
      # package links fail with EPERM when the NAPI CLI loads its dependencies.
      - name: Reset cached Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (Test-Path node_modules) { Remove-Item -LiteralPath node_modules -Recurse -Force }

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.settings.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.settings.target }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: packages/webview/target/
          key: ${{ matrix.settings.target }}-cargo-build-${{ github.sha }}
          restore-keys: |
            ${{ matrix.settings.target }}-cargo-build-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          if command -v sudo >/dev/null 2>&1; then
            SUDO=sudo
          else
            SUDO=
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y pkg-config

      - name: Install system dependencies (Linux x86_64)
        if: runner.os == 'Linux' && matrix.settings.sys_deps
        run: |
          sudo apt-get install -y ${{ matrix.settings.sys_deps }}

      - name: Install cross-compilation dependencies (Linux i386)
        if: runner.os == 'Linux' && matrix.settings.cross_arch == 'i386'
        run: |
          set -e
          if command -v sudo >/dev/null 2>&1; then
            SUDO=sudo
          else
            SUDO=
          fi
          $SUDO dpkg --add-architecture i386
          if [ -f /etc/os-release ] && grep -q 'Ubuntu' /etc/os-release; then
            # Some Ubuntu runner images restrict DEB822 sources to amd64. Keep
            # Ubuntu sources multiarch-aware without enabling i386 on third-party repos.
            $SUDO find /etc/apt/sources.list.d/ -type f -name "*.sources" -exec sh -c '
              if grep -qE "^URIs:.*ubuntu" "$1"; then
                if grep -q "^Architectures:" "$1"; then
                  sed -i -E "s/^Architectures:.*/Architectures: amd64 i386/" "$1"
                else
                  sed -i "/^Types: deb/a Architectures: amd64 i386" "$1"
                fi
              fi
            ' _ {} \;
            $SUDO find /etc/apt/sources.list.d/ -type f -name "*.list" -exec sed -i -E '/ubuntu/ s/\[arch=amd64\]/[arch=amd64,i386]/' {} +
            if [ -f /etc/apt/sources.list ]; then
              $SUDO sed -i -E '/ubuntu/ s/\[arch=amd64\]/[arch=amd64,i386]/' /etc/apt/sources.list
            fi
            $SUDO rm -f /etc/apt/sources.list.d/microsoft-prod.list
          fi
          $SUDO apt-get update
          # Debian provides the i386 libxdo development package that Ubuntu
          # does not publish for this architecture.
          $SUDO apt-get install --no-install-recommends -y libclang-dev \
            ${{ matrix.settings.cross_gcc }} \
            ${{ matrix.settings.cross_gpp }} \
            ${{ matrix.settings.cross_sys_deps }}

          for package in \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgtk-3-dev \
            libxdo-dev; do
            architecture="$(dpkg-query -W -f='${Architecture}' "$package:i386")"
            echo "$package:i386 -> $architecture"
            test "$architecture" = i386
          done

          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
          for pc_file in \
            glib-2.0 \
            webkit2gtk-4.1 \
            libsoup-3.0 \
            cairo \
            pango \
            atk \
            gdk-pixbuf-2.0 \
            gtk+-3.0; do
            echo "Checking $pc_file through i386 pkg-config"
            pkg-config --exists "$pc_file"
            pcfiledir="$(pkg-config --variable=pcfiledir "$pc_file")"
            echo "$pc_file -> $pcfiledir"
            test "$pcfiledir" = /usr/lib/i386-linux-gnu/pkgconfig
          done

          # libxdo-dev does not ship pkg-config metadata. Its i386 package
          # architecture is validated in the package loop above.

      - name: Install cross-compilation dependencies (Linux ARM)
        if: runner.os == 'Linux' && matrix.settings.cross_arch && matrix.settings.cross_arch != 'i386'
        run: |
          if command -v sudo >/dev/null 2>&1; then
            SUDO=sudo
          else
            SUDO=
          fi
          $SUDO dpkg --add-architecture ${{ matrix.settings.cross_arch }}
          $SUDO apt-get update
          # Debian Trixie's foreign libpsl-dev package can contain a different
          # shared manpage from the native package, which dpkg otherwise
          # rejects during multiarch installation.
          $SUDO apt-get \
            -o Dpkg::Options::=--force-overwrite \
            install --no-install-recommends -y \
            ${{ matrix.settings.cross_gcc }} \
            ${{ matrix.settings.cross_gpp }} \
            ${{ matrix.settings.cross_sys_deps }}

          for package in \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgtk-3-dev \
            libxdo-dev; do
            architecture="$($SUDO dpkg-query -W -f='${Architecture}' "$package:${{ matrix.settings.cross_arch }}")"
            echo "$package:${{ matrix.settings.cross_arch }} -> $architecture"
            test "$architecture" = "${{ matrix.settings.cross_arch }}"
          done

          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_SYSROOT_DIR=/
          export PKG_CONFIG_LIBDIR=/usr/lib/${{ matrix.settings.cross_triplet }}/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_PATH=/usr/lib/${{ matrix.settings.cross_triplet }}/pkgconfig:/usr/share/pkgconfig
          for pc_file in \
            glib-2.0 \
            webkit2gtk-4.1 \
            libsoup-3.0 \
            cairo \
            pango \
            atk \
            gdk-pixbuf-2.0 \
            gtk+-3.0; do
            echo "Checking $pc_file through ${{ matrix.settings.cross_triplet }} pkg-config"
            pkg-config --exists "$pc_file"
            pcfiledir="$(pkg-config --variable=pcfiledir "$pc_file")"
            echo "$pc_file -> $pcfiledir"
            test "$pcfiledir" = "/usr/lib/${{ matrix.settings.cross_triplet }}/pkgconfig"
          done

      - name: Install dependencies
        if: runner.os != 'Windows'
        run: bun install --frozen-lockfile

      - name: Install Windows dependencies with hoisted linker
        if: runner.os == 'Windows'
        run: bun install --frozen-lockfile --linker hoisted

      - name: Build
        run: ${{ matrix.settings.build_script || format('bun run build --target {0}', matrix.settings.target) }}
        shell: bash
        working-directory: packages/webview

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/webview/${{ env.APP_NAME }}.*.node
          if-no-files-found: error
          retention-days: 7

  # FreeBSD x64 — stub-only build.  The addon throws at runtime; it exists only
  # to satisfy package managers that resolve the freebsd-x64 optional package.
  # The full wry/wry GUI stack is NOT compiled (see Cargo.toml cfg guards).
  build-freebsd:
    needs: release-version
    if: needs.release-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    name: FreeBSD x64 (stub)
    timeout-minutes: 90
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v4

      - name: Start FreeBSD VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          version: '15.1'
          memory: 8G
          cpu_count: 3

      - name: Install dependencies
        run: |
          sudo pkg install -y -f curl node npm
          sudo npm install -g bun@1.3.14
          curl https://sh.rustup.rs -sSf --output rustup.sh
          sh rustup.sh -y --profile minimal --default-toolchain stable

      - name: Build
        env:
          DEBUG: napi:*
          RUSTUP_IO_THREADS: 1
        run: |
          . "$HOME/.cargo/env"
          rustc --version
          node -v
          bun --version
          bun install --frozen-lockfile
          cd packages/webview
          # FreeBSD exports only the unsupported native stub; its generated
          # bindings intentionally omit the public API, so skip the JS typecheck.
          bun run build:native

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-x86_64-unknown-freebsd
          path: packages/webview/${{ env.APP_NAME }}.*.node
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build
      - build-freebsd
      - release-version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set release package version
        if: needs.release-version.outputs.is_release == 'true'
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          node -e 'const fs = require("node:fs"); const manifest = JSON.parse(fs.readFileSync("package.json", "utf8")); manifest.version = process.env.VERSION; fs.writeFileSync("package.json", `${JSON.stringify(manifest, null, 2)}\n`);'
          bun run version
        shell: bash
        working-directory: packages/webview

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/webview/artifacts

      - name: Move artifacts
        run: bun run artifacts
        working-directory: packages/webview

      - name: List packages
        run: ls -R ./npm
        shell: bash
        working-directory: packages/webview

      - name: Verify release version
        if: needs.release-version.outputs.is_release == 'true'
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          set -euo pipefail
          WEBVIEW_VERSION="$(node -p 'require("./packages/webview/package.json").version')"
          if [[ "$WEBVIEW_VERSION" != "$VERSION" ]]; then
            echo "Release version $VERSION does not match packages/webview/package.json version $WEBVIEW_VERSION." >&2
            exit 1
          fi

      - name: Build package JavaScript and publish platform packages
        if: needs.release-version.outputs.is_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          npm_config_provenance: 'true'
        run: |
          bun run build:lib
          bun run prepublish:napi
        working-directory: packages/webview

      - name: Publish to npm
        if: needs.release-version.outputs.is_release == 'true'
        run: npm publish --ignore-scripts --provenance --access public --tag "${{ needs.release-version.outputs.tag }}"
        working-directory: packages/webview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build and publish creator packages
        if: needs.release-version.outputs.is_release == 'true'
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
          TAG: ${{ needs.release-version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          WEBVIEW_VERSION="$(node -p 'require("./packages/webview/package.json").version')"
          if [[ "$WEBVIEW_VERSION" != "$VERSION" ]]; then
            echo "Refusing creator publish: release version $VERSION does not match WebviewJS version $WEBVIEW_VERSION." >&2
            exit 1
          fi

          bun --filter create-webview build

          STAGING_DIR="$(mktemp -d "$RUNNER_TEMP/create-webview.XXXXXX")"
          cp packages/create-webview/package.json "$STAGING_DIR/package.json"
          cp packages/create-webview/README.md "$STAGING_DIR/README.md"
          cp packages/create-webview/LICENSE "$STAGING_DIR/LICENSE"
          cp -R packages/create-webview/dist "$STAGING_DIR/dist"

          node --input-type=module - "$STAGING_DIR/package.json" "$VERSION" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const [manifestPath, version] = process.argv.slice(2);
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
          manifest.name = 'create-webview';
          manifest.version = version;
          if (manifest.bin?.['create-webview'] !== './dist/index.js' || manifest.bin?.['create-webview-app'] !== './dist/index.js') {
            throw new Error('Staged creator manifest does not contain both shared CLI aliases.');
          }
          await writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');
          NODE

          node --input-type=module - "$STAGING_DIR/package.json" "$VERSION" <<'NODE'
          import { access, readFile, readdir } from 'node:fs/promises';
          const [manifestPath, version] = process.argv.slice(2);
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
          const files = (await readdir(new URL('.', `file://${manifestPath}`))).sort();
          if (manifest.name !== 'create-webview' || manifest.version !== version) {
            throw new Error(`Unexpected staged manifest identity: ${manifest.name}@${manifest.version}`);
          }
          for (const expected of ['LICENSE', 'README.md', 'dist', 'package.json']) {
            if (!files.includes(expected)) throw new Error(`Missing staged package file: ${expected}`);
          }
          await access(new URL('./dist/index.js', `file://${manifestPath}`));
          NODE

          package_version_exists() {
            local package_name="$1"
            local output
            if output="$(npm view "${package_name}@${VERSION}" version --json 2>&1)"; then
              echo "${package_name}@${VERSION} is already published; skipping."
              return 0
            fi

            if [[ "$output" == *E404* ]]; then
              return 10
            fi

            printf '%s\n' "$output" >&2
            echo "Could not verify whether ${package_name}@${VERSION} exists." >&2
            return 2
          }

          publish_if_missing() {
            local package_name="$1"
            local status=0
            package_version_exists "$package_name" || status=$?

            if [[ "$status" -eq 0 ]]; then
              return 0
            elif [[ "$status" -ne 10 ]]; then
              return "$status"
            fi

            echo "Publishing ${package_name}@${VERSION} with npm tag ${TAG}."
            npm publish --ignore-scripts --provenance --access public --tag "$TAG"
          }

          cd "$STAGING_DIR"
          publish_if_missing create-webview

          node --input-type=module - "package.json" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('package.json', 'utf8'));
          manifest.name = 'create-webview-app';
          await writeFile('package.json', `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');
          NODE

          node --input-type=module - "$VERSION" <<'NODE'
          import { readFile } from 'node:fs/promises';
          const [version] = process.argv.slice(2);
          const manifest = JSON.parse(await readFile('package.json', 'utf8'));
          if (manifest.name !== 'create-webview-app' || manifest.version !== version) {
            throw new Error('Mirror package identity changed unexpectedly.');
          }
          NODE
          publish_if_missing create-webview-app

      - name: Skip publish (not a release)
        if: needs.release-version.outputs.is_release == 'false'
        run: |
          echo "Not a release commit, skipping publish"
