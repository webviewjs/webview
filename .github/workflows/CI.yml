name: Release CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package.json version to publish (0.x semver)'
        required: true
        type: string
      npm_tag:
        description: npm dist-tag for every package
        required: true
        default: v0
        type: choice
        options:
          - latest
          - next
          - rc
          - beta
          - v0
      resume:
        description: Skip exact versions already on npm and publish missing packages
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Serialize the entire release, including retries and environment approval.
# Keep this group when the corresponding main workflow is introduced.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate branch, semver, and dist-tag
        run: node .github/scripts/release.mjs validate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.npm_tag }}
          RELEASE_RESUME: ${{ inputs.resume }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check registry state before building
        run: node .github/scripts/release.mjs unpublished
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.npm_tag }}
          RELEASE_RESUME: ${{ inputs.resume }}

  build:
    needs: validate
    uses: ./.github/workflows/Build.yml

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.npm_tag }}
      RELEASE_RESUME: ${{ inputs.resume }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Revalidate release inputs and registry state
        run: |
          node .github/scripts/release.mjs validate
          node .github/scripts/release.mjs unpublished
      - name: Download native artifacts from this run
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: artifacts
      - name: Require every native artifact
        run: node .github/scripts/release.mjs artifacts
      - name: Assemble NAPI platform packages
        run: bun run artifacts
      - name: Verify assembled binaries
        run: node .github/scripts/release.mjs assembled
      - name: Publish platform packages and root package with provenance
        run: node .github/scripts/release.mjs publish
        env:
          npm_config_tag: ${{ inputs.npm_tag }}
          npm_config_provenance: 'true'
          npm_config_access: public
      - name: Create GitHub Release with native artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/v0" ]]; then
            echo "GitHub Releases must be created from the v0 branch."
            exit 1
          fi

          release_tag="v${RELEASE_VERSION}"
          shopt -s nullglob
          assets=(artifacts/bindings-*/*.node)
          if [[ "${#assets[@]}" -ne 12 ]]; then
            echo "Expected 12 native release artifacts, found ${#assets[@]}."
            exit 1
          fi

          tag_ref="refs/tags/${release_tag}"
          if git rev-parse --verify --quiet "${tag_ref}^{commit}" >/dev/null; then
            tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
            if ! git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA"; then
              echo "${release_tag} does not point to a commit in this v0 run's history."
              exit 1
            fi
          fi

          if release_json="$(gh release view "$release_tag" --json assets)"; then
            if ! git rev-parse --verify --quiet "${tag_ref}^{commit}" >/dev/null; then
              echo "${release_tag} exists, but its Git tag is missing from the checkout."
              exit 1
            fi

            existing_assets="$(jq -r '.assets[].name' <<< "$release_json")"
            missing_assets=()
            for asset in "${assets[@]}"; do
              asset_name="${asset##*/}"
              if ! grep -Fxq "$asset_name" <<< "$existing_assets"; then
                missing_assets+=("$asset")
              fi
            done

            if [[ "${#missing_assets[@]}" -gt 0 ]]; then
              gh release upload "$release_tag" "${missing_assets[@]}"
            else
              echo "${release_tag} already contains all 12 native artifacts."
            fi
          else
            release_options=(--target "$GITHUB_SHA" --title "$release_tag" --generate-notes)
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              release_options+=(--prerelease)
            fi
            gh release create "$release_tag" "${assets[@]}" "${release_options[@]}"
          fi
