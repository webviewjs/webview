name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test

  rust:
    name: Rust unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebKitGTK build dependencies
        run: |
          sudo apt-get update
          packages=(
            pkg-config
            libwebkit2gtk-4.1-dev
            libsoup-3.0-dev
            libglib2.0-dev
            libcairo2-dev
            libpango1.0-dev
            libatk1.0-dev
            libgdk-pixbuf-2.0-dev
            libgtk-3-dev
            libxdo-dev
          )
          sudo apt-get install --no-install-recommends -y "${packages[@]}"
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('packages/webview/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: packages/webview/target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('packages/webview/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ hashFiles('packages/webview/Cargo.lock') }}-
      - run: cargo test --manifest-path packages/webview/Cargo.toml --lib
